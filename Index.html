<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mis XV Años - Valery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Montserrat', Arial, sans-serif; 
        }

        body { 
            background: radial-gradient(circle, #3b1443 0%, #1a0826 60%, #0a0210 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 5px;
        }

        .app-container { 
            width: 100%; 
            max-width: 400px; 
            height: 95vh; 
            background: linear-gradient(180deg, #180525 0%, #0d0214 100%); 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: center; 
            color: #d4af37; 
            text-align: center; 
            overflow: hidden; 
            border-radius: 24px;
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.6), inset 0 0 15px rgba(212, 175, 55, 0.4); 
            border: 3px solid #d4af37; 
            padding: 15px 10px;
        }

        .header-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2rem;
            font-weight: 700;
            color: #f3e5ab;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.7), 0 0 8px rgba(186, 85, 211, 0.8);
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .gallery-container {
            width: 100%;
            height: 65vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
        }

        .stars-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #f3e5ab;
            border-radius: 50%;
            box-shadow: 0 0 8px #d4af37;
            animation: twinkle 1.5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 2;
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        .slide img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 16px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(147, 112, 219, 0.7), 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .gold-phrase {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.25rem;
            font-style: italic;
            color: #f5d77f;
            margin-top: 15px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9), 0 0 8px rgba(212, 175, 55, 0.6);
            padding: 0 15px;
        }

        .thank-you-text {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #f3e5ab 25%, #d4af37 50%, #ffffff 75%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.9)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.9));
            text-transform: uppercase;
            animation: diamondGlow 2s infinite alternate;
        }

        @keyframes diamondGlow {
            0% { filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 10px rgba(255, 255, 255, 0.6)); }
            100% { filter: drop-shadow(0 0 18px rgba(212, 175, 55, 1)) drop-shadow(0 0 25px rgba(255, 255, 255, 1)); }
        }

        .controls-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            height: 70px;
            z-index: 3;
        }

        .btn-nav {
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #d4af37 100%);
            border: 2px solid #f3e5ab;
            color: #1a0826;
            padding: 12px 20px;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 2px;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8), 0 0 8px rgba(186, 85, 211, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .btn-nav:hover {
            background: linear-gradient(135deg, #f3e5ab 0%, #ffffff 50%, #f3e5ab 100%);
            box-shadow: 0 0 25px rgba(212, 175, 55, 1), 0 0 15px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .btn-nav:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.9);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .btn-nav:disabled:hover {
            transform: scale(1);
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #d4af37 100%);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        .page-indicator {
            position: absolute;
            bottom: 12px;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 0.9rem;
            color: #f3e5ab;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(212, 175, 55, 0.6);
            z-index: 4;
        }

        @media (max-width: 480px) {
            .controls-container {
                gap: 20px;
            }
            .btn-nav {
                width: 48px;
                height: 48px;
                font-size: 1.1rem;
            }
            .header-title {
                font-size: 1.6rem;
            }
            .thank-you-text {
                font-size: 2rem;
            }
            .gold-phrase {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 320px) {
            .controls-container {
                gap: 15px;
            }
            .btn-nav {
                width: 44px;
                height: 44px;
                font-size: 1rem;
                padding: 8px 12px;
            }
            .header-title {
                font-size: 1.4rem;
            }
            .gold-phrase {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-title">Mis XV Años</div>

        <div class="gallery-container">
            <div class="stars-container" id="starsContainer"></div>

            <div class="slide active">
                <img src="foto1.jpg" alt="Foto 1">
                <p class="gold-phrase">"Agradecida con Dios por cada una de sus bendiciones."</p>
            </div>

            <div class="slide">
                <img src="foto2.jpg" alt="Foto 2">
                <p class="gold-phrase">"Comienza un nuevo viaje lleno de amor y sueños."</p>
            </div>

            <div class="slide">
                <img src="foto3.jpg" alt="Foto 3">
                <p class="gold-phrase">"Una noche mágica e inolvidable bajo las estrellas."</p>
            </div>

            <div class="slide">
                <img src="foto4.jpg" alt="Foto 4">
                <p class="gold-phrase">"Un momento muy especial para compartir juntos."</p>
            </div>

            <div class="slide">
                <img src="foto5.jpg" alt="Foto 5">
                <p class="gold-phrase">"La alegría de celebrar junto a ustedes este gran día."</p>
            </div>

            <div class="page-indicator">
                <span id="pageNumber">1</span> / 5
            </div>
        </div>

        <div class="controls-container" id="action-area">
            <button class="btn-nav" id="btnPrev" onclick="prevSlide()" title="Anterior">❮</button>
            <button class="btn-nav" id="btnNext" onclick="nextSlide()" title="Siguiente">❯</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const pageNumber = document.getElementById('pageNumber');
        const actionArea = document.getElementById('action-area');
        let isTransitioning = false;

        function generateStars() {
            const starsContainer = document.getElementById('starsContainer');
            const starCount = 12;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const randomX = Math.random() * 100;
                const randomY = Math.random() * 100;
                const randomDelay = Math.random() * 1.5;
                const randomSize = Math.random() * 4 + 4;
                
                star.style.left = randomX + '%';
                star.style.top = randomY + '%';
                star.style.animationDelay = randomDelay + 's';
                star.style.width = randomSize + 'px';
                star.style.height = randomSize + 'px';
                
                starsContainer.appendChild(star);
            }
        }

        function nextSlide() {
            if (isTransitioning || currentSlide >= slides.length - 1) return;
            
            isTransitioning = true;
            slides[currentSlide].classList.remove('active');
            currentSlide++;
            slides[currentSlide].classList.add('active');
            updateUI();
            
            if (currentSlide === slides.length - 1) {
                setTimeout(() => {
                    showThankYouMessage();
                }, 800);
            }
            
            setTimeout(() => { isTransitioning = false; }, 800);
        }

        function prevSlide() {
            if (isTransitioning || currentSlide <= 0) return;
            
            isTransitioning = true;
            slides[currentSlide].classList.remove('active');
            currentSlide--;
            slides[currentSlide].classList.add('active');
            updateUI();
            
            if (currentSlide < slides.length - 1) {
                hideThankYouMessage();
            }
            
            setTimeout(() => { isTransitioning = false; }, 800);
        }

        function updateUI() {
            pageNumber.textContent = currentSlide + 1;
            btnPrev.disabled = currentSlide === 0;
            btnNext.disabled = currentSlide === slides.length - 1;
        }

        function showThankYouMessage() {
            actionArea.innerHTML = '<div class="thank-you-text">✨ ¡Gracias! ✨</div>';
            actionArea.style.justifyContent = 'center';
        }

        function hideThankYouMessage() {
            actionArea.innerHTML = `
                <button class="btn-nav" id="btnPrev" onclick="prevSlide()" title="Anterior">❮</button>
                <button class="btn-nav" id="btnNext" onclick="nextSlide()" title="Siguiente">❯</button>
            `;
            actionArea.style.justifyContent = 'center';
            actionArea.style.gap = '30px';
            updateUI();
        }

        generateStars();
        updateUI();
    </script>
</body>
</html>
